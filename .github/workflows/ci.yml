name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Never build/run contributor code with elevated tokens (no pull_request_target).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: lint, typecheck, content, unit, a11y, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to immutable commit SHAs per docs/V0.2_DEVELOPMENT_CONTEXT.md §12.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate
      - name: Cache pnpm store
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Validate content packs
        run: pnpm content:validate
      - name: Unit + component + content tests
        run: pnpm test
      - name: Accessibility smoke
        run: pnpm test:a11y
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=moderate
      - name: Audit build and test dependencies
        run: pnpm audit --audit-level=high
      - name: Build
        run: pnpm build

  e2e:
    name: e2e + service worker (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate
      - name: Cache pnpm store
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm --filter @mediprompt/learner-web exec playwright install --with-deps chromium
      - name: Run e2e
        run: pnpm test:e2e

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
