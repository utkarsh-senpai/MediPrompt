name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Unlike ci.yml, this workflow publishes: it needs Pages/id-token write, and the
# token stays scoped to this file only.
permissions:
  contents: read
  pages: write
  id-token: write

# Queue deploys; never cancel one mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build PWA artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to immutable commit SHAs per docs/V0.2_DEVELOPMENT_CONTEXT.md §12.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate
      - name: Cache pnpm store
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: apps/learner-web/dist

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
